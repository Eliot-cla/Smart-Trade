<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="g" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E8C973" />
      <stop offset="100%" stop-color="#C9A648" />
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="14" fill="#08080A" />
  <!-- three candlesticks, rightmost tallest — a simple, recognizable
       "chart reading" mark that stays legible at 16px -->
  <rect x="14" y="34" width="7" height="14" rx="1.5" fill="url(#g)" opacity="0.55" />
  <line x1="17.5" y1="30" x2="17.5" y2="52" stroke="url(#g)" stroke-width="2" opacity="0.55" stroke-linecap="round" />

  <rect x="28.5" y="24" width="7" height="20" rx="1.5" fill="url(#g)" opacity="0.8" />
  <line x1="32" y1="18" x2="32" y2="48" stroke="url(#g)" stroke-width="2" opacity="0.8" stroke-linecap="round" />

  <rect x="43" y="14" width="7" height="24" rx="1.5" fill="url(#g)" />
  <line x1="46.5" y1="9" x2="46.5" y2="42" stroke="url(#g)" stroke-width="2.2" stroke-linecap="round" />
</svg>
